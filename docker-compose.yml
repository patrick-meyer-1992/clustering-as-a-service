services:
  fastapi:
    container_name: caas-fastapi
    build:
      context: .
      dockerfile: app/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --reload
    volumes:
      - ./app/code/:/code/
    ports:
      - "7001:8000"
    env_file:
      - ./message_broker/.env
    environment:
      - RABBITMQ_HOST=caas-rabbitmq
      - DEBUG=1 # For hot reload

  streamlit:
    container_name: caas-streamlit
    build:
      context: .
      dockerfile: app/Dockerfile
    command: streamlit run streamlit/app.py --server.port=8501 --server.enableCORS=false
    volumes:
      - ./streamlit:/code/streamlit
    ports:
      - "8501:8501"
    #depends_on:
    #  - fastapi

  rabbitmq:
    image: rabbitmq:4-management
    container_name: caas-rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    env_file:
      - ./message_broker/.env
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 2s

  clustering:
    container_name: caas-clustering
    build: ./app
    command: celery -A tasks worker --loglevel=info
    env_file:
      - ./message_broker/.env
    environment:
      - RABBITMQ_HOST=caas-rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  mongodb:
    image: mongo
    container_name: caas-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d
    env_file:
      - ./mongodb/.env

  redis:
    image: redis
    restart: unless-stopped
    container_name: caas-redis
    ports:
      - '6379:6379'

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
  mongodb-data:
    driver: local

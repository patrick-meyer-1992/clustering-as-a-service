services:
  fastapi:
    container_name: caas-fastapi
    build:
      context: ./app
      dockerfile: fastapi.Dockerfile
    command: uvicorn fastapi_main:app --host 0.0.0.0 --reload
    ports:
      - "7001:8000"
    volumes:
      - ./app/code/:/code/ # For hot reload
    env_file:
      - ./message_broker/.env
      - ./object_storage/.env
      - ./redis/.env
      - ./mongodb/.env
    environment:
      - DEBUG=1 # For hot reload

  streamlit:
    container_name: caas-streamlit
    build:
      context: ./app
      dockerfile: streamlit.Dockerfile
    # command: streamlit run /code/streamlit/app.py --server.port=8501 --server.enableCORS=false
    ports:
      - "8501:8501"
    # volumes:
    #   - ./streamlit:/code/streamlit
    #depends_on:
    #  - fastapi

  rabbitmq:
    image: rabbitmq:4-management
    container_name: caas-rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    env_file:
      - ./message_broker/.env
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 2s

  clustering:
    container_name: caas-clustering
    build:
      context: ./app
      dockerfile: clustering.Dockerfile
    env_file:
      - ./message_broker/.env
      - ./redis/.env
      - ./app/.env
    depends_on:
      rabbitmq:
        condition: service_healthy

  mongodb:
    image: mongo
    container_name: caas-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d
    env_file:
      - ./mongodb/.env

  redis:
    image: redis
    restart: unless-stopped
    container_name: caas-redis
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    container_name: caas-minio
    ports:
      - "6000:9000"
      - "6001:9001"
    env_file:
      - ./object_storage/.env
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  automl-worker:
    build:
      context: ./app
      dockerfile: automl.Dockerfile
    env_file:
      - ./message_broker/.env
      - ./redis/.env
    depends_on:
      - redis
    restart: always    

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
  mongodb-data:
    driver: local
  minio-data:
    driver: local
